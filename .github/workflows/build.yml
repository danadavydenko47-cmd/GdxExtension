name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: geode-sdk/ubuntu-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build mod
        run: |
          geode sdk install nightly --platform android --force
          geode build -p android

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GdxExtension
          path: build*/*.geode
